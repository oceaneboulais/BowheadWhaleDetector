server {
    listen 7860;

    # Disable gzip on proxied responses so sub_filter can read them.
    proxy_set_header  Accept-Encoding  "";

    location / {
        proxy_pass         http://127.0.0.1:7861;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;

        # Inject a tiny script into TensorBoard's index.html that sends the
        # browser to the Embedding Projector tab on first load (no hash yet).
        # After the JS sets the hash, location.hash is non-empty so the
        # condition is false on every subsequent request — no infinite loop.
        sub_filter '</head>'
            '<script>if(!window.location.hash){window.location.replace(window.location.href.split("#")[0]+"#projector");}</script></head>';
        sub_filter_once on;
    }
}
